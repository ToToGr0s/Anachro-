<title>Anachro Prod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : en-tête (semaine en cours + jalon) → avancement par personne → onglets → une vue à la fois. Une couleur par personne. */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --sunk:#E7E9EF; --fg:#151821; --muted:#5D6375; --line:#D3D7E0;
  --accent:#C2410C; --accent-soft:#FBE3D6;
  --theo:#2F5FD0; --theo-soft:#E2EAFB; --celian:#1F8A5B; --celian-soft:#DDF3E8; --olivier:#B4590E; --olivier-soft:#FBE9D8;
  --hanae:#C2377A; --hanae-soft:#FBE1EE; --art:#8B3FB8; --art-soft:#F1E3F8; --tous:#4B5263; --tous-soft:#E4E6EC;
  --doing:#B7860B; --doing-soft:#FBF0CF; --done:#1F8A5B; --done-soft:#DDF3E8; --blocked:#C0262D; --blocked-soft:#FBDADB;
  --scrim:rgba(15,18,26,.45);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141A; --surface:#1B1E26; --sunk:#242833; --fg:#E9EBF1; --muted:#9BA1B3; --line:#323746;
  --accent:#F08A4B; --accent-soft:#3A2418;
  --theo:#7FA3F5; --theo-soft:#1D2742; --celian:#5CC994; --celian-soft:#16301F; --olivier:#F0A061; --olivier-soft:#3A2614;
  --hanae:#F08CBB; --hanae-soft:#3A1A2A; --art:#C990EC; --art-soft:#2E1F3A; --tous:#AEB4C4; --tous-soft:#262A35;
  --doing:#E9BC45; --doing-soft:#3A3014; --done:#5CC994; --done-soft:#16301F; --blocked:#F0686E; --blocked-soft:#3D1A1C;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141A; --surface:#1B1E26; --sunk:#242833; --fg:#E9EBF1; --muted:#9BA1B3; --line:#323746;
  --accent:#F08A4B; --accent-soft:#3A2418;
  --theo:#7FA3F5; --theo-soft:#1D2742; --celian:#5CC994; --celian-soft:#16301F; --olivier:#F0A061; --olivier-soft:#3A2614;
  --hanae:#F08CBB; --hanae-soft:#3A1A2A; --art:#C990EC; --art-soft:#2E1F3A; --tous:#AEB4C4; --tous-soft:#262A35;
  --doing:#E9BC45; --doing-soft:#3A3014; --done:#5CC994; --done-soft:#16301F; --blocked:#F0686E; --blocked-soft:#3D1A1C;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit}
.muted{color:var(--muted)}

.top{display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:end;margin-bottom:20px}
.top h1{font-size:clamp(30px,5vw,44px);font-weight:800}
.top .sub{color:var(--muted);margin-top:2px}
.now{display:flex;gap:12px;flex-wrap:wrap}
.pill-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:0}
.pill-box .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.pill-box .v{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.2}
.pill-box .v small{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:500}
.pill-box.hot{border-color:var(--accent);background:var(--accent-soft)}

.progress{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:18px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog .name{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;min-width:0}
.prog .pct{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%}
.prog .meta{font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:8px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{font:600 15px var(--f-body);color:var(--muted);background:none;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tabs button:hover{background:var(--sunk);color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.note{font-size:14px;color:var(--muted);margin:0 0 14px}
.banner{background:var(--doing-soft);border:1px solid var(--doing);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:16px}
.empty{padding:18px;color:var(--muted);font-size:15px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* Cette semaine */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:start}
.col{min-width:0;display:flex;flex-direction:column;gap:10px}
.colh{display:flex;align-items:center;gap:10px;padding:4px 2px;border-bottom:3px solid var(--c);}
.colh h3{font-size:21px}
.colh span{font-size:13px;color:var(--muted);margin-left:auto}

.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.gcard>header{display:flex;gap:8px;align-items:baseline;padding:10px 12px 6px;flex-wrap:wrap}
.gcard>header h4{margin:0;font-size:16px;font-weight:600}
.gcard>header .cnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--c-soft);color:var(--c)}
.gcard.alldone>header h4{text-decoration:line-through;color:var(--muted)}
.subs{display:flex;flex-direction:column;padding:0 4px 6px}
.sub{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:7px}
.sub:hover{background:var(--sunk)}
.sub input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--done);flex:none;cursor:pointer}
.sub .txt{flex:1;min-width:0;font-size:15px;line-height:1.4}
.sub.done .txt{text-decoration:line-through;color:var(--muted)}
.sub .who{font-size:12px;color:var(--muted);display:block}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.badge.doing{background:var(--doing-soft);color:var(--doing)}
.badge.blocked{background:var(--blocked-soft);color:var(--blocked)}
.edit{flex:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px;border-radius:5px;opacity:.55}
.sub:hover .edit,.edit:focus-visible{opacity:1}
.late{margin-top:4px}
.late>summary{cursor:pointer;font-weight:600;color:var(--blocked);font-size:14px;padding:4px 2px}

/* Planning */
.plan{overflow-x:auto}
.pgrid{display:grid;grid-template-columns:120px repeat(6,minmax(170px,1fr));min-width:1170px}
.pgrid>div{padding:10px 8px;border-bottom:1px solid var(--line);min-width:0}
.phead{position:sticky;top:0;background:var(--bg);font-weight:700;border-bottom:2px solid var(--fg)!important;display:flex;gap:6px;align-items:center}
.wk h3{font-size:22px;font-weight:800}
.wk .d{font-size:13px;color:var(--muted)}
.wk.cur h3{color:var(--accent)}
.row-past{opacity:.5}
.mile{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.now-tag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent);color:var(--bg)}
.chips{display:flex;flex-direction:column;gap:5px}
.chip{display:flex;gap:6px;justify-content:space-between;align-items:baseline;padding:6px 8px;border-radius:7px;font-size:13.5px;line-height:1.3;background:var(--c-soft);color:var(--fg);border:1px solid transparent}
.chip b{font-family:var(--f-mono);font-size:11.5px;color:var(--c);flex:none;font-variant-numeric:tabular-nums}
.chip.cdone{opacity:.55;text-decoration:line-through}
.chip.cblocked{border-color:var(--blocked)}
.gapline{grid-column:1/-1;padding:9px 8px!important;font-size:13.5px;color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 8px,var(--sunk) 8px 9px)}
.phase{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--accent);padding-top:22px!important}

/* Toutes les tâches */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chipbtn{font:600 14px var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:99px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chipbtn[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.toolbar select,.toolbar input,.form select,.form input{font:500 14px var(--f-body);padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}
.toolbar input[type=search]{flex:1 1 200px}
.primary{font:600 14px var(--f-body);background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.ghost{font:600 14px var(--f-body);background:none;color:var(--fg);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.danger{font:600 14px var(--f-body);background:none;color:var(--blocked);border:1.5px solid var(--blocked);border-radius:8px;padding:8px 14px;cursor:pointer}
.wgroup{margin-bottom:22px}
.wgroup>h3{font-size:19px;margin-bottom:8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.wgroup>h3 small{font:500 14px var(--f-body);color:var(--muted)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}

/* Jalons / infos */
.miles{display:flex;flex-direction:column;gap:10px}
.ms{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ms .when{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.ms .when small{display:block;font:500 14px var(--f-body);color:var(--muted)}
.ms h3{font-size:19px}
.ms p{margin:2px 0 0;color:var(--muted);font-size:15px}
.ms .state{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.ms.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.st-past{background:var(--sunk);color:var(--muted)} .st-next{background:var(--accent);color:var(--bg)} .st-later{background:var(--sunk);color:var(--fg)}
.alerts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:28px}
.alert{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 16px;min-width:0}
.alert h3{font-size:18px;margin-bottom:4px}
.alert p{margin:0;color:var(--muted);font-size:15px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:24px}
.role{border-radius:var(--r);padding:14px 16px;min-width:0;background:var(--c-soft)}
.role h3{font-size:21px;color:var(--c)}
.role p{margin:4px 0 0;font-size:15px}
.rename{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.rename label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}

/* Règles */
details.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.rule>summary{cursor:pointer;padding:14px 16px;font-family:var(--f-display);font-weight:600;font-size:20px;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.rule>summary::-webkit-details-marker{display:none}
details.rule>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.rule[open]>summary::after{content:"–"}
.rb{padding:0 16px 16px}
.rb ol,.rb ul{margin:0;padding-left:22px}
.rb li{margin:6px 0}
.rb li b{font-weight:600}
.rb li span{color:var(--muted)}
pre.tree{font-family:var(--f-mono);font-size:13.5px;background:var(--sunk);border-radius:8px;padding:14px;overflow-x:auto;margin:0 0 10px;line-height:1.55}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td code,li code,p code{font-family:var(--f-mono);font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:4px}

/* Éditeur */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.form h2{font-size:22px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.form .actions .sp{flex:1}
.form .err{color:var(--blocked);font-size:14px;margin:0}

.c-theo{--c:var(--theo);--c-soft:var(--theo-soft)} .c-celian{--c:var(--celian);--c-soft:var(--celian-soft)} .c-olivier{--c:var(--olivier);--c-soft:var(--olivier-soft)} .c-hanae{--c:var(--hanae);--c-soft:var(--hanae-soft)}
.c-art{--c:var(--art);--c-soft:var(--art-soft)} .c-tous{--c:var(--tous);--c-soft:var(--tous-soft)}


/* Liens rapides (GDD…) */
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qbtn{display:inline-flex;align-items:center;gap:7px;font:600 14px var(--f-body);text-decoration:none;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:6px 14px}
.qbtn:hover{border-color:var(--fg)}
.qbtn.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qbtn .ext{font-size:12px;opacity:.7}
.qbtn.add{border-style:dashed;color:var(--muted)}
a{color:var(--accent)}
.linkbtn{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.pill-box.clk{cursor:pointer;text-align:left;font:inherit;color:inherit}
.pill-box.clk:hover{box-shadow:0 0 0 2px var(--accent)}

/* Groupes repliables */
.gcard>header{cursor:pointer;user-select:none}
.gcard>header::after{content:"▾";font-size:12px;color:var(--muted);margin-left:2px;transition:transform .15s}
.gcard.shut>header::after{transform:rotate(-90deg)}
.gcard.shut>.subs{display:none}
.gcard.hl{box-shadow:0 0 0 3px var(--accent)}

/* Toutes les tâches : liste compacte */
.spr{margin-bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.spr.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sprh{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(90px,180px) auto;gap:14px;align-items:center;padding:12px 16px;background:var(--sunk)}
.sprh:hover{background:var(--line)}
.sprh:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.sprh .sn{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.sprh .sd{font-size:14px;color:var(--muted);min-width:0}
.sprh .sd b{color:var(--fg);font-weight:600}
.sprh .sm{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.sprh .go{font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.mbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mnum{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px;text-align:right}
.glist{display:flex;flex-direction:column}
.grow{border-top:1px solid var(--line)}
.grow>button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:4px minmax(0,1fr) auto 110px 16px;gap:12px;align-items:center;padding:9px 16px 9px 0}
.grow>button:hover{background:var(--sunk)}
.grow>button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.grow .stripe{align-self:stretch;background:var(--c);border-radius:0 3px 3px 0}
.grow .gt{font-weight:600;font-size:15px;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow .gw{font-size:13px;color:var(--muted);white-space:nowrap}
.grow .chev{font-size:12px;color:var(--muted);transition:transform .15s}
.grow.open .chev{transform:rotate(90deg)}
.grow.alldone .gt>span:first-child{text-decoration:line-through;color:var(--muted)}
.grow .subs{padding:0 12px 10px 20px}
.grow .badge{margin-left:0}
.mini{display:flex;flex-direction:column;gap:3px}

/* Fenêtre sprint */
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:min(1100px,100%);display:flex;flex-direction:column;overflow:hidden;margin-bottom:24px}
.sheet>header{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sheet .sh1{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sheet .sh1 h2{font-size:30px;font-weight:800;line-height:1.1}
.sheet .sh1 h2 small{font:500 16px var(--f-body);color:var(--muted);margin-left:8px}
.sheet .sh1 .sp{flex:1}
.sheet .navb{display:flex;gap:6px}
.sheet .st{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.sheet .st.live{background:var(--accent);color:var(--bg)}
.sheet .milebox{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:15px}
.sheet .milebox b{color:var(--accent)}
.sheet .stats{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.sheet .stats .bar{flex:1 1 220px;margin:0;height:10px}
.sheet .stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.sheet .sb{padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.sheet .sb .col{gap:8px}
@media (max-width:700px){
  .sprh{grid-template-columns:auto minmax(0,1fr)}
  .sprh .mini,.sprh .go{grid-column:2}
  .grow>button{grid-template-columns:4px minmax(0,1fr) 16px}
  .grow .gw,.grow .mini{display:none}
  .sheet .sh1 h2{font-size:24px}
  .scrim{padding:8px}
}
button.chip{font:inherit;font-size:13.5px;width:100%;text-align:left;cursor:pointer}
button.chip:hover{border-color:var(--c)}
.wk button{all:unset;cursor:pointer;display:block}
